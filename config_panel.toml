version = "1.0"

# Values are stored as app settings (no `bind`), and scripts/config re-renders
# /etc/ejabberd/ejabberd.yml from the template before restarting ejabberd itself.
# Binding straight into the rendered file would forbid conditional blocks: a setting
# that renders to nothing (an unset XEP-0157 contact) would leave the panel with no
# line to read or write.

[main]
name.en = "ejabberd configuration"
name.fr = "Configuration ejabberd"

    [main.upload]
    name.en = "File sharing"
    name.fr = "Partage de fichiers"

        [main.upload.http_upload_size]
        ask.en = "Maximum size per shared file"
        ask.fr = "Taille maximale d'un fichier partagé"
        type = "select"
        choices."10485760" = "10 MiB"
        choices."20971520" = "20 MiB"
        choices."52428800" = "50 MiB"
        choices."104857600" = "100 MiB"
        choices."209715200" = "200 MiB"
        choices."524288000" = "500 MiB"

    [main.contact]
    name.en = "Server contact"
    name.fr = "Contact du serveur"

        [main.contact.xmpp_contact_address]
        ask.en = "Contact address (XEP-0157)"
        ask.fr = "Adresse de contact (XEP-0157)"
        help.en = "Advertised as the server contact (XEP-0157). Enter an address you actually receive, e.g. mailto:you@example.org; leave empty to advertise none."
        help.fr = "Annoncée comme contact du serveur (XEP-0157). Entrez une adresse que vous recevez réellement, par ex. mailto:vous@example.org ; laissez vide pour n'en annoncer aucune."
        type = "string"
        default = ""
