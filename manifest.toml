packaging_format = 2

id = "ejabberd"
name = "ejabberd"
description.en = "Robust, scalable and modular XMPP server"
description.fr = "Serveur XMPP robuste, scalable et modulaire"

version = "24.12~ynh6"

maintainers = ["TabTwo"]

[upstream]
license = "GPL-2.0-only"
website = "https://www.ejabberd.im/"
admindoc = "https://docs.ejabberd.im/"
code = "https://github.com/processone/ejabberd"
cpe = "cpe:2.3:a:process-one:ejabberd"

[integration]
# ejabberd is installed via apt (resources.apt), so the actual ejabberd version
# tracks whatever the host's Debian release ships. This app's ejabberd.yml uses
# 24.12-era features (mod_muc_occupantid, mod_stun_disco, mod_http_upload
# custom_headers) that only exist in the ejabberd shipped by Debian 13 (trixie);
# bookworm's older ejabberd would fail to start. Trixie == YunoHost 13, so the floor
# is 13.0. (Trixie/YNH13 is still the unstable branch as of this writing -- the only
# branch package_check will build for trixie.)
yunohost = ">= 13.0"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = true
sso = false          # XMPP clients auth via LDAP directly, not the SSO portal
disk = "50M"
ram.build = "50M"
ram.runtime = "256M"

[install]
    [install.domain]
    type = "domain"

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]

    [resources.ports]
    client.default = 5222
    client.exposed = "TCP"
    client.fixed = true
    client2.default = 5223
    client2.exposed = "TCP"
    client2.fixed = true
    server.default = 5269
    server.exposed = "TCP"
    server.fixed = true
    server2.default = 5270
    server2.exposed = "TCP"
    server2.fixed = true
    http.default = 5443
    http.exposed = "TCP"
    http.fixed = true
    proxy.default = 7777
    proxy.exposed = "TCP"
    proxy.fixed = true

    [resources.apt]
    # git: fetches ejabberd-contrib sources for mod_pubsub_serverinfo (XEP-0485);
    # the module is pure Erlang, compiled by erlc from erlang-base (ejabberd dep).
    packages = "ejabberd, git"
