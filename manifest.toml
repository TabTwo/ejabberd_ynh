packaging_format = 2

id = "ejabberd"
name = "ejabberd"
description.en = "Robust, scalable and modular XMPP server"
description.fr = "Serveur XMPP robuste, scalable et modulaire"

version = "24.12~ynh2"

maintainers = ["TabTwo"]

[upstream]
license = "GPL-2.0-only"
website = "https://www.ejabberd.im/"
admindoc = "https://docs.ejabberd.im/"
code = "https://github.com/processone/ejabberd"
cpe = "cpe:2.3:a:process-one:ejabberd"

[integration]
# ejabberd is installed via apt (resources.apt), so the actual ejabberd version
# tracks whatever the host's Debian release ships, not this floor directly -- this
# floor is about the minimum YunoHost helpers/resource-system version required, not
# a guarantee of ejabberd 24.12. Mirrors prosody_ynh's floor convention.
yunohost = ">= 12.0.9"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = true
sso = false          # XMPP clients auth via LDAP directly, not the SSO portal
disk = "50M"
ram.build = "50M"
ram.runtime = "256M"

[install]
    [install.domain]
    type = "domain"

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]

    [resources.ports]
    client.default = 5222
    client.exposed = "TCP"
    client.fixed = true
    client2.default = 5223
    client2.exposed = "TCP"
    client2.fixed = true
    server.default = 5269
    server.exposed = "TCP"
    server.fixed = true
    server2.default = 5270
    server2.exposed = "TCP"
    server2.fixed = true
    http.default = 5443
    http.exposed = "TCP"
    http.fixed = true
    proxy.default = 7777
    proxy.exposed = "TCP"
    proxy.fixed = true

    [resources.apt]
    packages = "ejabberd"
