loglevel: info
log_rotate_count: 0

hosts:
  - {{ domain }}

certfiles:
  - "/etc/yunohost/certs/{{ domain }}/crt.pem"
  - "/etc/yunohost/certs/{{ domain }}/key.pem"

define_macro:
  'TLS_OPTIONS':
    - "no_sslv3"
    - "no_tlsv1"
    - "no_tlsv1_1"
    - "cipher_server_preference"
    - "no_compression"
  # XEP-0157 server contact address (config panel field, empty by default).
  # Deliberately NOT wrapped in a jinja conditional: the config panel binds
  # straight to this scalar line (bind = "XMPP_CONTACT_ADDRESS:...ejabberd.yml")
  # via ynh_read/write_var_in_file, so the line must exist in the *rendered* file
  # even when empty -- otherwise the panel can neither read nor set it. ejabberd
  # resolves the macro reference in mod_disco.server_info.urls below. When empty
  # this advertises a single empty-string URL instead of omitting the server_info
  # entry -- harmless (valid, schema-conforming), just not a perfectly empty disco
  # response. Dropping the entry entirely would require moving the panel to
  # bind=settings + a scripts/config that re-renders (see TabTwo/ejabberd_ynh).
  'XMPP_CONTACT_ADDRESS': "{{ xmpp_contact_address }}"

c2s_protocol_options: 'TLS_OPTIONS'
s2s_protocol_options: 'TLS_OPTIONS'

## --- Authentication: YunoHost LDAP, permission-gated (PLAIN over TLS) ---
auth_method: [ldap]
ldap_servers: ["localhost"]
ldap_encrypt: none
ldap_port: 389
ldap_base: "ou=users,dc=yunohost,dc=org"
ldap_uids:
  uid: "%u"
ldap_filter: "(permission=cn={{ app }}.main,ou=permission,dc=yunohost,dc=org)"

disable_sasl_mechanisms:
  - "digest-md5"
  - "X-OAUTH2"
s2s_use_starttls: required

listen:
  -
    port: {{ port_client }}
    ip: "::"
    module: ejabberd_c2s
    max_stanza_size: 262144
    shaper: c2s_shaper
    access: c2s
    starttls_required: true
    protocol_options: 'TLS_OPTIONS'
  -
    port: {{ port_client2 }}
    ip: "::"
    module: ejabberd_c2s
    max_stanza_size: 262144
    shaper: c2s_shaper
    access: c2s
    tls: true
    protocol_options: 'TLS_OPTIONS'
  -
    port: {{ port_server }}
    ip: "::"
    module: ejabberd_s2s_in
    max_stanza_size: 524288
    shaper: s2s_shaper
  -
    port: {{ port_server2 }}
    ip: "::"
    module: ejabberd_s2s_in
    max_stanza_size: 524288
    shaper: s2s_shaper
    tls: true
    protocol_options: 'TLS_OPTIONS'
  -
    port: {{ port_http }}
    ip: "::"
    module: ejabberd_http
    tls: true
    protocol_options: 'TLS_OPTIONS'
    request_handlers:
      /api: mod_http_api
      /bosh: mod_bosh
      /upload: mod_http_upload
      /ws: ejabberd_http_ws

acl:
  local:
    user_regexp: ""
  loopback:
    ip:
      - 127.0.0.0/8
      - ::1/128

access_rules:
  local: {allow: local}
  c2s: {deny: blocked, allow: all}
  announce: {allow: admin}
  configure: {allow: admin}
  muc_create: {allow: local}
  pubsub_createnode: {allow: local}

shaper:
  normal: {rate: 3000, burst_size: 20000}
  fast: 200000

shaper_rules:
  max_user_sessions: 10
  c2s_shaper: {none: admin, normal: all}
  s2s_shaper: fast

modules:
  mod_adhoc: {}
  mod_admin_extra: {}
  mod_announce: {access: announce}
  mod_avatar: {}
  mod_blocking: {}
  mod_bosh: {}
  mod_caps: {}
  mod_carboncopy: {}
  mod_client_state: {}
  mod_configure: {}
  mod_disco:
    # XEP-0157 server contact address; 'XMPP_CONTACT_ADDRESS' macro is defined above
    # (empty string by default). See the config-panel field xmpp_contact_address.
    server_info:
      -
        modules: all
        name: "abuse-addresses"
        urls: ['XMPP_CONTACT_ADDRESS']
      -
        modules: all
        name: "admin-addresses"
        urls: ['XMPP_CONTACT_ADDRESS']
  mod_http_api: {}
  mod_http_upload:
    put_url: "https://@HOST@:{{ port_http }}/upload"
    docroot: "{{ data_dir }}/upload"
    max_size: {{ http_upload_size }}
    # XEP-0363: CORS headers so web clients can upload
    custom_headers:
      "Access-Control-Allow-Origin": "*"
      "Access-Control-Allow-Methods": "GET,HEAD,PUT,OPTIONS"
      "Access-Control-Allow-Headers": "Content-Type"
  mod_last: {}
  mod_mam:
    assume_mam_usage: true
    default: always
  mod_muc:
    access: [allow]
    access_admin: [{allow: admin}]
    access_create: muc_create
    access_persistent: muc_create
    access_mam: [allow]
    default_room_options: {mam: true}
  mod_muc_admin: {}
  mod_muc_occupantid: {}  # XEP-0421 anonymous unique occupant identifiers
  mod_offline: {access_max_user_messages: 5000}
  mod_ping: {}
  mod_privacy: {}
  mod_private: {}
  mod_proxy65:
    access: local
    port: {{ port_proxy }}
    max_connections: 5
  mod_pubsub:
    access_createnode: pubsub_createnode
    plugins: [flat, pep]
    force_node_config:
      "eu.siacs.conversations.axolotl.*": {access_model: open}
      "storage:bookmarks": {access_model: whitelist}
  mod_push: {}
  mod_push_keepalive: {}
  mod_roster: {versioning: true}
  mod_s2s_bidi: {}
  mod_s2s_dialback: {}
  mod_shared_roster: {}
  mod_stream_mgmt: {resend_on_timeout: if_offline}
{% if turn_secret and turn_port %}
  # STUN/TURN (XEP-0215) is advertised only when coturn is available -- coturn is a
  # SOFT dependency (scripts/install tries to install it, a failure is non-fatal), so
  # _common.sh leaves turn_secret/turn_port empty when it is absent and this whole
  # module is then dropped: ejabberd runs fine, only NAT-traversal for A/V is missing.
  mod_stun_disco:
    credentials_lifetime: 12h
    # coturn shares a REST auth secret (turnserver_pwd); ejabberd generates matching
    # temporary TURN credentials from it. `secret` is a module-level option (not
    # per-service); the TURN service is marked `restricted` so it requires them.
    # _common.sh reads coturn's port_turnserver_tls, so services are the TLS variants
    # (type stuns/turns, transport tcp).
    secret: "{{ turn_secret }}"
    services:
      -
        host: {{ turn_host }}
        port: {{ turn_port }}
        type: stuns
        transport: tcp
      -
        host: {{ turn_host }}
        port: {{ turn_port }}
        type: turns
        transport: tcp
        restricted: true
{% endif %}
  mod_vcard: {search: false}
  mod_vcard_xupdate: {}
  mod_version: {}
