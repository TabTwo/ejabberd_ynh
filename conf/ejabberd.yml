loglevel: info
log_rotate_count: 0

hosts:
  - __DOMAIN__

certfiles:
  - "/etc/yunohost/certs/__DOMAIN__/crt.pem"
  - "/etc/yunohost/certs/__DOMAIN__/key.pem"

define_macro:
  'TLS_OPTIONS':
    - "no_sslv3"
    - "no_tlsv1"
    - "no_tlsv1_1"
    - "cipher_server_preference"
    - "no_compression"

c2s_protocol_options: 'TLS_OPTIONS'
s2s_protocol_options: 'TLS_OPTIONS'

## --- Authentication: YunoHost LDAP, permission-gated (PLAIN over TLS) ---
auth_method: [ldap]
ldap_servers: ["localhost"]
ldap_encrypt: none
ldap_port: 389
ldap_base: "ou=users,dc=yunohost,dc=org"
ldap_uids:
  - "uid": "%u"
ldap_filter: "(permission=cn=__APP__.main,ou=permission,dc=yunohost,dc=org)"

disable_sasl_mechanisms:
  - "digest-md5"
  - "X-OAUTH2"
s2s_use_starttls: required

listen:
  -
    port: __PORT_CLIENT__
    ip: "::"
    module: ejabberd_c2s
    max_stanza_size: 262144
    shaper: c2s_shaper
    access: c2s
    starttls_required: true
    protocol_options: 'TLS_OPTIONS'
  -
    port: __PORT_CLIENT2__
    ip: "::"
    module: ejabberd_c2s
    max_stanza_size: 262144
    shaper: c2s_shaper
    access: c2s
    tls: true
    protocol_options: 'TLS_OPTIONS'
  -
    port: __PORT_SERVER__
    ip: "::"
    module: ejabberd_s2s_in
    max_stanza_size: 524288
    shaper: s2s_shaper
  -
    port: __PORT_SERVER2__
    ip: "::"
    module: ejabberd_s2s_in
    max_stanza_size: 524288
    shaper: s2s_shaper
    tls: true
    protocol_options: 'TLS_OPTIONS'
  -
    port: __PORT_HTTP__
    ip: "::"
    module: ejabberd_http
    tls: true
    protocol_options: 'TLS_OPTIONS'
    request_handlers:
      /api: mod_http_api
      /bosh: mod_bosh
      /upload: mod_http_upload
      /ws: ejabberd_http_ws

s2s_direct_tls_ports: [__PORT_SERVER2__]

acl:
  local:
    user_regexp: ""
  loopback:
    ip:
      - 127.0.0.0/8
      - ::1/128

access_rules:
  local: {allow: local}
  c2s: {deny: blocked, allow: all}
  announce: {allow: admin}
  configure: {allow: admin}
  muc_create: {allow: local}
  pubsub_createnode: {allow: local}

shaper:
  normal: {rate: 3000, burst_size: 20000}
  fast: 200000

shaper_rules:
  max_user_sessions: 10
  c2s_shaper: {none: admin, normal: all}
  s2s_shaper: fast

modules:
  mod_adhoc: {}
  mod_admin_extra: {}
  mod_announce: {access: announce}
  mod_avatar: {}
  mod_blocking: {}
  mod_bosh: {}
  mod_caps: {}
  mod_carboncopy: {}
  mod_client_state: {}
  mod_configure: {}
  mod_disco: {}
  mod_http_api: {}
  mod_http_upload:
    put_url: "https://@HOST@:__PORT_HTTP__/upload"
    docroot: "__DATA_DIR__/upload"
    max_size: __HTTP_UPLOAD_SIZE__
  mod_last: {}
  mod_mam:
    assume_mam_usage: true
    default: always
  mod_muc:
    access: [allow]
    access_admin: [{allow: admin}]
    access_create: muc_create
    access_persistent: muc_create
    access_mam: [allow]
    default_room_options: {mam: true}
  mod_muc_admin: {}
  mod_offline: {access_max_user_messages: 5000}
  mod_ping: {}
  mod_privacy: {}
  mod_private: {}
  mod_proxy65:
    access: local
    port: __PORT_PROXY__
    max_connections: 5
  mod_pubsub:
    access_createnode: pubsub_createnode
    plugins: [flat, pep]
    force_node_config:
      "eu.siacs.conversations.axolotl.*": {access_model: open}
      "storage:bookmarks": {access_model: whitelist}
  mod_push: {}
  mod_push_keepalive: {}
  mod_roster: {versioning: true}
  mod_s2s_bidi: {}
  mod_s2s_dialback: {}
  mod_shared_roster: {}
  mod_stream_mgmt: {resend_on_timeout: if_offline}
  mod_stun_disco:
    credentials_lifetime: 12h
    services:
      -
        host: __TURN_HOST__
        port: __TURN_PORT__
        type: stun
        transport: udp
      -
        host: __TURN_HOST__
        port: __TURN_PORT__
        type: turn
        transport: udp
        secret: "__TURN_SECRET__"
  mod_vcard: {search: false}
  mod_vcard_xupdate: {}
  mod_version: {}
