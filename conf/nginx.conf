# XEP-0156 alternative connection methods + BOSH/WebSocket.
# These paths must be public — `access_by_lua_block { return }` bypasses
# YunoHost's SSOwat access check (otherwise it 302-redirects to the portal).
location = /.well-known/host-meta {
    access_by_lua_block { return }
    alias /var/www/.well-known/__DOMAIN__/host-meta;
    default_type 'application/xrd+xml';
    add_header Access-Control-Allow-Origin '*';
}
location = /.well-known/host-meta.json {
    access_by_lua_block { return }
    alias /var/www/.well-known/__DOMAIN__/host-meta.json;
    default_type 'application/json';
    add_header Access-Control-Allow-Origin '*';
}
location /http-bind {
    access_by_lua_block { return }
    proxy_pass https://127.0.0.1:__PORT_HTTP__/bosh;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_ssl_verify off;
}
location /ws {
    access_by_lua_block { return }
    proxy_pass https://127.0.0.1:__PORT_HTTP__/ws;
    proxy_http_version 1.1;
    proxy_set_header Connection "upgrade";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Host $host;
    proxy_ssl_verify off;
}
